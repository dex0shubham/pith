listen = "0.0.0.0:8787"
anthropic_upstream = "https://api.anthropic.com"
openai_upstream = "https://api.openai.com"
litellm_upstream = "http://localhost:4000"   # only used by sweeps of routes recorded by the LiteLLM guardrail
portkey_upstream = "http://localhost:8787"   # only used by sweeps of routes recorded by the Portkey webhook
webhook_token = ""                           # set to require "Authorization: Bearer <token>" on POST /optimizer/portkey
db_path = "./pith.db"
sample_rate = 0.05          # fraction of requests whose bodies are stored
retention_days = 14
sweep_budget_usd_month = 0  # 0 = observe only, never sweep
equivalence_bar = 0.95
judge_model = "claude-sonnet-5-5"
judge_provider = "anthropic"

[prices."gpt-5"]            # $/M tokens; extends/overrides the built-in Claude table (illustrative values — check current pricing)
input = 1.25
output = 10.0

[routes."<route-key-or-name>"]
enabled = true
equivalence_bar = 0.97

[portkey_headers]           # sent on every replay through Portkey (a saved config id, provider, virtual key, ...)
"x-portkey-provider" = "openai"
