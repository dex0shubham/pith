[project]
name = "pith-optimizer"
version = "0.2.0"
description = "Self-hosted output-token control plane proxy for Claude and OpenAI APIs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "tokens", "proxy", "litellm", "portkey", "headroom", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "tiktoken>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.urls]
Homepage = "https://github.com/dex0shubham/pith"
Repository = "https://github.com/dex0shubham/pith"

[project.scripts]
pith = "pith.__main__:main"

[project.entry-points."headroom.proxy_extension"]
pith = "pith.headroom:install"

[project.entry-points."headroom.pipeline_extension"]
pith = "pith.headroom:PithPipeline"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
